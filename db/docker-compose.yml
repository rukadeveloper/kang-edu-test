services:
  postgres:
    image: postgres:18
    container_name: kang-edu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Seoul
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # 18 버전부터 데이터 경로가 /var/lib/postgresql/18/docker 로 바뀌어 상위 경로를 마운트한다
      - pgdata:/var/lib/postgresql
      # 볼륨이 비어 있을 때(최초 실행)만 파일명 순서대로 실행된다
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
